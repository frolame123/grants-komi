name: Проверки и сборка

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  checks:
    name: Самопроверки и миграции
    runs-on: ubuntu-latest

    # Настоящая СУБД, а не заглушка: миграции и часть проверок работают
    # только против PostgreSQL — частичные индексы, JSONB, перечислимые типы
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grants
          POSTGRES_PASSWORD: grants
          POSTGRES_DB: grants
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grants"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://grants:grants@localhost:5432/grants
      SECRET_KEY: ci-secret-key-not-used-in-production
      PUBLIC_URL: http://localhost:5173
      PYTHONIOENCODING: utf-8

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Накат миграций на чистую базу
        run: alembic upgrade head

      - name: Откат до пустой базы и повторный накат
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Заливка тестовых данных
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f db/seed.sql
        env:
          PGURL: postgresql://grants:grants@localhost:5432/grants

      - name: Проверка правил без базы
        run: |
          python check_models.py
          python check_auth.py
          python check_business.py
          python check_workflow.py
          python check_admin.py
          python check_dictionaries.py
          python check_moderation.py
          python check_aggregation.py
          python check_adapters.py
          python check_notifications.py

      - name: Проверки против СУБД
        run: |
          python check_stats.py
          python check_api.py

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа серверной части
        run: docker build -t grants-komi-backend ./backend

      - name: Запуск контейнера и проверка отклика
        run: |
          docker run -d --name backend -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg2://grants:grants@127.0.0.1:5432/grants \
            -e SECRET_KEY=ci-secret-key \
            grants-komi-backend
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:8000/api/health; then
              echo "" && echo "контейнер отвечает"
              exit 0
            fi
            sleep 2
          done
          echo "контейнер не ответил, журнал:"
          docker logs backend
          exit 1
